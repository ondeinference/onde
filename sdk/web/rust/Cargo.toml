[package]
name = "onde-web"
version = "1.5.0"
edition = "2021"
rust-version = "1.94"
description = "The wasm engine behind the @ondeinference/web npm package."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# GGUF loading, the Qwen2 forward pass and sampling, on the CPU.
vectoron = "0.2"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Cache",
  "CacheStorage",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# wasm-opt needs SIMD flags to match the +simd128 build; skip it so the build
# has no network step beyond cargo.
wasm-opt = false

# Built for wasm32 only, with its own Cargo.lock; kept out of the root workspace.
[workspace]
