name: CI

# One run per commit: PRs run on pull_request, and push only fires on the
# integration branches (development, main) so every merged commit gets a
# result. `pull_request` has no `branches:` filter, so stacked PRs still run.
#
# Jobs are routed by the `changes` job, so a change only runs the checks it
# can break. Editing this file re-runs everything once.

on:
  push:
    branches: [main, development]
    paths-ignore: &ignored
      - ".agents/**"
      - ".claude/**"
      - "assets/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE-*"
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

permissions:
  contents: read

# Read by build.rs through option_env!() and baked in when present. Empty on
# fork PRs, which still type-check without them.
env:
  CARGO_TERM_COLOR: always
  GRESIQ_API_KEY_DEV: ${{ secrets.GRESIQ_API_KEY_DEV }}
  GRESIQ_API_SECRET_DEV: ${{ secrets.GRESIQ_API_SECRET_DEV }}
  GRESIQ_API_KEY_PRODUCTION: ${{ secrets.GRESIQ_API_KEY_PRODUCTION }}
  GRESIQ_API_SECRET_PRODUCTION: ${{ secrets.GRESIQ_API_SECRET_PRODUCTION }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dart: ${{ steps.filter.outputs.dart }}
      release: ${{ steps.filter.outputs.release }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "build.rs"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "scripts/**"
              - "uniffi-bindgen/**"
              - "sdk/dart/rust/**"
              - "sdk/react-native/rust/**"
              - ".github/workflows/ci.yml"
            dart:
              - "sdk/dart/**"
              - ".github/workflows/ci.yml"
            release:
              - "Cargo.toml"
              - "Cargo.lock"
              - "**/CHANGELOG.md"
              - "Makefile"
              - "scripts/**"
              - "sdk/**"
              - ".github/workflows/release-preflight.yml"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"

  # rust-toolchain.toml is the single source of truth for the Rust version, but
  # dtolnay/rust-toolchain takes `toolchain` as a required input and will not
  # read that file. Left implicit, the action installs plain `stable` while bare
  # `cargo` resolves to the pinned channel, a different toolchain with none of
  # the requested components or targets. Resolve the pin once and feed it to
  # every Rust job. The Rust jobs need this one, so they skip when it skips.
  toolchain:
    name: Toolchain
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "::error::Failed to read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

  # Same gate the release workflows use, minus the tag check, so version drift
  # surfaces on a branch instead of on release day.
  preflight:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/release-preflight.yml

  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color

  dart-sdk:
    name: Dart SDK (Flutter)
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: sdk/dart/.flutter-version
          channel: stable
          cache: true
      - name: Install Dart dependencies
        working-directory: sdk/dart
        run: flutter pub get
      - name: Analyze Dart package
        working-directory: sdk/dart
        run: flutter analyze --no-fatal-infos
      - name: Analyze score-sensitive generated Dart files
        working-directory: sdk/dart
        run: |
          flutter analyze lib/src/frb_generated.dart/api.dart
          flutter analyze lib/src/frb_generated.dart/frb_generated.dart
          flutter analyze lib/src/frb_generated.dart/frb_generated.io.dart
      - name: Verify Apple SwiftPM manifests exist
        working-directory: sdk/dart
        run: |
          test -f ios/onde_inference/Package.swift
          test -f ios/onde_inference/Sources/onde_inference/OndeInferencePlugin.swift
          test -f macos/onde_inference/Package.swift
          test -f macos/onde_inference/Sources/onde_inference/OndeInferencePlugin.swift
      - name: Run Dart package tests
        working-directory: sdk/dart
        run: flutter test
      - name: Restore generated files modified by flutter pub get
        working-directory: sdk/dart
        run: git checkout -- . 2>/dev/null || true
      - name: Dry-run Dart publish
        working-directory: sdk/dart
        run: flutter pub publish --dry-run

  fmt:
    name: Format
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint-test:
    name: Clippy + test (macOS)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: macos-host
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  check-macos-intel:
    name: Check (macOS x86_64)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: macos-intel
      - run: cargo check --target x86_64-apple-darwin

  check-ios:
    name: Check (iOS device)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ios
      - run: cargo check --target aarch64-apple-ios

  check-ios-sim:
    name: Check (iOS simulator)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ios-sim
      - run: cargo check --target aarch64-apple-ios-sim

  check-tvos:
    name: Check (tvOS device)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: tvos
      - run: cargo +nightly check -Z build-std --target aarch64-apple-tvos

  check-tvos-sim:
    name: Check (tvOS simulator)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: tvos-sim
      - run: cargo +nightly check -Z build-std --target aarch64-apple-tvos-sim

  check-visionos:
    name: Check (visionOS device)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: visionos
      - run: cargo +nightly check -Z build-std --target aarch64-apple-visionos

  check-visionos-sim:
    name: Check (visionOS simulator)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: visionos-sim
      - run: cargo +nightly check -Z build-std --target aarch64-apple-visionos-sim

  check-watchos:
    name: Check (watchOS device)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: watchos
      - run: cargo +nightly check -Z build-std --target aarch64-apple-watchos

  check-watchos-sim:
    name: Check (watchOS simulator)
    needs: toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: watchos-sim
      - run: cargo +nightly check -Z build-std --target aarch64-apple-watchos-sim

  check-linux:
    name: Check (Linux x86_64)
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: linux-x86_64
      - run: cargo check --target x86_64-unknown-linux-gnu

  # Compiles against the stub engine so its signatures cannot drift from the
  # real ChatEngine (ed-agent builds against both).
  check-wasm32:
    name: Check (wasm32)
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: wasm32
      - run: cargo check --target wasm32-unknown-unknown --lib
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

  check-android:
    name: Check (Android arm64)
    runs-on: ubuntu-latest
    needs: toolchain
    env:
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android34-clang
      CC_aarch64_linux_android: aarch64-linux-android34-clang
      AR_aarch64_linux_android: llvm-ar
      CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7a-linux-androideabi34-clang
      CC_armv7_linux_androideabi: armv7a-linux-androideabi34-clang
      AR_armv7_linux_androideabi: llvm-ar
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: android-actions/setup-android@v4
      - name: Configure Android NDK toolchain
        shell: bash
        run: |
          echo "${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: android-arm64
      - run: cargo check --target aarch64-linux-android
      # 32-bit target: catches usize-width overflows in const expressions
      # (onde-mistralrs-core 0.9.5 broke the Kotlin release this way).
      - name: Check armv7
        run: cargo check --target armv7-linux-androideabi
      # The Dart SDK's FFI crate is what actually ships in the Android AAR, so
      # check it too — a core change can compile while breaking the bridge.
      - name: Check Dart FFI crate
        run: cargo check --target aarch64-linux-android --manifest-path sdk/dart/rust/Cargo.toml

  check-windows:
    name: Check (Windows x86_64)
    needs: toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: windows-x86_64
      - run: cargo check --target x86_64-pc-windows-msvc

  ci:
    name: CI status
    if: always()
    needs: [changes, toolchain, preflight, actionlint, dart-sdk, fmt, lint-test, check-macos-intel, check-ios, check-ios-sim, check-tvos, check-tvos-sim, check-visionos, check-visionos-sim, check-watchos, check-watchos-sim, check-linux, check-wasm32, check-android, check-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in success|skipped) ;; *) echo "::error::job result: $result"; exit 1;; esac
          done
