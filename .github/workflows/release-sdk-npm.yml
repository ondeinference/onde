name: Release SDK npm

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap ubuntu gate: version agreement, crates.io publishability, tag match.
  # Blocks the expensive job below so a metadata fault never costs runner time.
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # ── Validate (every run) ──────────────────────────────────────────────────
  validate:
    needs: preflight
    name: Validate
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    env:
      GRESIQ_API_KEY_DEV: ${{ secrets.GRESIQ_API_KEY_DEV }}
      GRESIQ_API_SECRET_DEV: ${{ secrets.GRESIQ_API_SECRET_DEV }}
      GRESIQ_API_KEY_PRODUCTION: ${{ secrets.GRESIQ_API_KEY_PRODUCTION }}
      GRESIQ_API_SECRET_PRODUCTION: ${{ secrets.GRESIQ_API_SECRET_PRODUCTION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # ── Read version ───────────────────────────────────────────────────────

      - name: Read version from package.json
        id: meta
        working-directory: sdk/react-native
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm SDK version: $VERSION"

      # ── Validate tag = package.json version (tag push only) ────────────────

      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG_VERSION'. Update package.json or re-tag."
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      # ── Build & dry-run ────────────────────────────────────────────────────

      - name: Install dependencies
        working-directory: sdk/react-native
        run: npm install

      - name: Build TypeScript
        working-directory: sdk/react-native
        run: npm run build

      - name: Dry-run package
        working-directory: sdk/react-native
        run: npm pack --dry-run

  # ── Publish to npm (tag push only) ────────────────────────────────────────
  #
  # Publishing uses npm trusted publishing (OIDC), not a long-lived token.
  # The npm side is configured at
  #   npmjs.com/package/@ondeinference/react-native/access
  # with the trusted publisher: repo ondeinference/onde, workflow
  # release-sdk-npm.yml, environment release-sdk-npm. All three must keep
  # matching what this job declares below, or npm answers the publish with a
  # 404 on PUT.
  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-sdk-npm

    permissions:
      contents: read
      id-token: write

    env:
      GRESIQ_API_KEY_DEV: ${{ secrets.GRESIQ_API_KEY_DEV }}
      GRESIQ_API_SECRET_DEV: ${{ secrets.GRESIQ_API_SECRET_DEV }}
      GRESIQ_API_KEY_PRODUCTION: ${{ secrets.GRESIQ_API_KEY_PRODUCTION }}
      GRESIQ_API_SECRET_PRODUCTION: ${{ secrets.GRESIQ_API_SECRET_PRODUCTION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10, which predates OIDC publishing. Trusted
      # publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        working-directory: sdk/react-native
        run: npm install

      - name: Build TypeScript
        working-directory: sdk/react-native
        run: npm run build

      - name: Publish @ondeinference/react-native to npm
        working-directory: sdk/react-native
        run: |
          npm_package_name=$(node -p "require('./package.json').name")
          npm_package_version=$(node -p "require('./package.json').version")

          if npm view "${npm_package_name}@${npm_package_version}" version >/dev/null 2>&1; then
            echo "${npm_package_name}@${npm_package_version} already exists on npm, skipping publish"
            exit 0
          fi

          npm publish --access public
