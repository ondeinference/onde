name: Release SDK Swift

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Swift release assets from the selected ref"
        type: boolean
        default: false
      release_tag:
        description: "Existing semver tag to publish on manual runs, for example 1.1.1"
        type: string
        required: false

permissions:
  contents: write

jobs:
  # Cheap ubuntu gate: version agreement, crates.io publishability, tag match.
  # Blocks the expensive job below so a metadata fault never costs runner time.
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build-and-release:
    needs: preflight
    runs-on: macos-26

    env:
      GRESIQ_API_KEY_DEV: ${{ secrets.GRESIQ_API_KEY_DEV }}
      GRESIQ_API_SECRET_DEV: ${{ secrets.GRESIQ_API_SECRET_DEV }}
      GRESIQ_API_KEY_PRODUCTION: ${{ secrets.GRESIQ_API_KEY_PRODUCTION }}
      GRESIQ_API_SECRET_PRODUCTION: ${{ secrets.GRESIQ_API_SECRET_PRODUCTION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout onde
        uses: actions/checkout@v6

      # Read the channel from rust-toolchain.toml so it is pinned in exactly one
      # place. Hardcoding it here is what let CI drift onto stable 1.92 while the
      # dependency tree required 1.94, failing the 1.2.0 release.
      - name: Read Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "::error::Failed to read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      # tvOS targets are tier-3 — no prebuilt std libs available via rustup.
      # The build script uses `cargo +nightly -Z build-std` which compiles std
      # from source using the rust-src component. Do NOT list tvOS in targets:.
      - name: Install nightly Rust toolchain for tvOS
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Build Swift XCFramework
        run: .github/scripts/build-swift-xcframework.sh

      # ── Read build outputs ────────────────────────────────────────────────

      - name: Read version and checksum
        id: meta
        run: |
          VERSION=$(cat dist/swift/version.txt)
          CHECKSUM=$(cat dist/swift/OndeFramework.checksum.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          fi

          if [ -n "${RELEASE_TAG}" ]; then
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          CARGO_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag is required when publish=true on workflow_dispatch runs."
            exit 1
          fi

          if [ "$RELEASE_TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match Cargo.toml version '$CARGO_VERSION'. Update Cargo.toml or publish the matching tag."
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"

      # ── Upload CI artifacts (manual runs only) ───────────────────────────

      - name: Upload XCFramework artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: onde-swift-xcframework
          path: |
            dist/swift/OndeFramework.xcframework.zip
            dist/swift/OndeFramework.checksum.txt
            dist/swift/version.txt
            dist/swift/Package/Sources/Onde/onde.swift
          if-no-files-found: error
          retention-days: 14

      # ── Create GitHub Release and attach assets ──────────────────────────

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ${{ steps.release.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/swift/OndeFramework.xcframework.zip
            dist/swift/OndeFramework.checksum.txt

      # ── Update onde-swift ────────────────────────────────────────────────

      - name: Checkout onde-swift
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: actions/checkout@v6
        with:
          repository: ondeinference/onde-swift
          token: ${{ secrets.ONDE_SWIFT_PAT }}
          path: onde-swift

      - name: Rewrite Package.swift release constants
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          CHECKSUM: ${{ steps.meta.outputs.checksum }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.release_tag }}/OndeFramework.xcframework.zip
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          pkg = pathlib.Path("onde-swift/Package.swift")
          src = pkg.read_text()

          url      = os.environ["RELEASE_URL"]
          checksum = os.environ["CHECKSUM"].strip()

          url_pattern = re.compile(
              r'(let releaseFrameworkURL =\s*\n\s*")([^"]+)(")',
              re.MULTILINE,
          )
          checksum_pattern = re.compile(
              r'(let releaseFrameworkChecksum =\s*\n\s*")([^"]+)(")',
              re.MULTILINE,
          )

          def replace_constant(pattern, value, text, label):
              updated_text, count = pattern.subn(
                  lambda match: f"{match.group(1)}{value}{match.group(3)}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f"{label} pattern did not match - check Package.swift format")
              return updated_text

          updated = replace_constant(url_pattern, url, src, "releaseFrameworkURL")
          updated = replace_constant(
              checksum_pattern,
              checksum,
              updated,
              "releaseFrameworkChecksum",
          )

          pkg.write_text(updated)
          print("Package.swift updated:")
          print(updated)
          PY

      - name: Copy generated onde.swift into onde-swift
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        run: |
          cp dist/swift/Package/Sources/Onde/onde.swift \
             onde-swift/Sources/Onde/onde.swift

      - name: Commit and tag onde-swift
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          VERSION: ${{ steps.release.outputs.release_tag }}
        run: |
          cd onde-swift
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift Sources/Onde/onde.swift

          if git diff --cached --quiet; then
            echo "No changes to commit — Package.swift and onde.swift are already up to date."
          else
            git commit -m "Release $VERSION"
          fi

          # Push the commit to main first so the tag points to the latest HEAD
          git push origin HEAD:main

          # Create an annotated tag only if it doesn't already exist on the remote.
          # Never force-overwrite — SPM caches the resolved commit SHA per tag,
          # so moving a tag silently breaks every consumer's Package.resolved.
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            echo "::warning::Tag $VERSION already exists on onde-swift — skipping tag push."
            echo "To re-release this version, delete the remote tag first:"
            echo "  git push origin :refs/tags/$VERSION"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi
