name: Release SDK Rust (crates.io)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap ubuntu gate: version agreement, crates.io publishability, tag match.
  # Blocks the expensive job below so a metadata fault never costs runner time.
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish:
    needs: preflight
    name: cargo publish
    runs-on: macos-26

    env:
      GRESIQ_API_KEY_DEV: ${{ secrets.GRESIQ_API_KEY_DEV }}
      GRESIQ_API_SECRET_DEV: ${{ secrets.GRESIQ_API_SECRET_DEV }}
      GRESIQ_API_KEY_PRODUCTION: ${{ secrets.GRESIQ_API_KEY_PRODUCTION }}
      GRESIQ_API_SECRET_PRODUCTION: ${{ secrets.GRESIQ_API_SECRET_PRODUCTION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "::error::Failed to read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Skip a version already on crates.io instead of hard-failing. crates.io is
      # immutable, so a re-run of a partially-failed release would otherwise die
      # here on "already uploaded" — the npm workflow has had this guard all along.
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(python3 scripts/sync-release-version.py --print)"
          if cargo info "onde@${VERSION}" >/dev/null 2>&1; then
            echo "onde ${VERSION} is already on crates.io — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # --locked forbids resolving anything other than the committed Cargo.lock,
      # so the crate published is built from the same graph CI tested.
      - name: cargo publish --dry-run
        if: steps.published.outputs.skip != 'true'
        run: cargo publish --dry-run --locked

      - name: cargo publish
        if: startsWith(github.ref, 'refs/tags/') && steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
