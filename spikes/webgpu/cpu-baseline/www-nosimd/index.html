<!doctype html><meta charset="utf-8"><title>cpu-baseline</title><pre id="log"></pre>
<script type="module">
  const log = (s) => (document.getElementById("log").textContent += s + "\n");
  const w = new Worker("./worker.js" + location.search, { type: "module" });
  w.onmessage = (e) => {
    if (e.data.progress) log(e.data.progress);
    if (e.data.done) { window.__result = e.data.done; log("DONE"); }
    if (e.data.error) { window.__partial = e.data.partial; window.__error = e.data.error; log("ERROR " + e.data.error); }
  };
  window.__start = () => w.postMessage("go");
</script>
