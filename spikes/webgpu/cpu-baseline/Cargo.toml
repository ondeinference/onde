[package]
name = "spike-cpu-baseline"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike. Not part of the onde workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native-bench"
path = "src/bin/native_bench.rs"

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
